<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çöp Adam Savaşı</title>
<style>
  :root{--bg:#000;--fg:#fff;--accent:#f21b0b;color-scheme:dark}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:rgba(0,0,0,.88);color:var(--fg);font-family:system-ui,sans-serif;cursor:pointer;gap:14px;user-select:none}
  #ov b{font-size:44px;letter-spacing:8px}
  #ov b i{color:var(--accent);font-style:normal}
  #ov span{opacity:.7;font-size:15px}
  #bar{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="ov"><b>SAVA<i>Ş</i></b><span>▶ Başlatmak için tıkla (sesli)</span></div>
<script>
// ===================== temel =====================
const cv = document.getElementById('c'), X = cv.getContext('2d');
const ov = document.getElementById('ov'), bar = document.getElementById('bar');
let W, H, DPR;
function rs(){ DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; }
addEventListener('resize', rs); rs();

const R = Math.random, PI = Math.PI;
const clamp = (v,a,b) => v<a?a:v>b?b:v, lerp = (a,b,t) => a+(b-a)*t;
const eio = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const eo = t => 1-Math.pow(1-t,3), ei = t => t*t*t;
function rng(s){ return () => { s = (s*16807) % 2147483647; return (s-1)/2147483646; }; }

const BLK = '#0e0e0e', RED = '#f21b0b', WHT = '#ffffff';
const cam = { x:0, y:-15, z:1 };
let shake = 0, flashA = 0, flashC = '255,255,255', fadeA = 0, hitstop = 0, zoomKick = 0;
let parts = [];
let si = 0, st = 0, prevSt = -1, started = false;

const at  = tm => prevSt < tm && st >= tm;          // tam bu anda mı geçtik
const seg = (a,b) => clamp((st-a)/(b-a), 0, 1);

// ===================== ses =====================
let AC, NB, master;
function initAudio(){
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    NB = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = R()*2-1;
    master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
  }catch(e){ AC = null; }
}
function noise(dur,type,f0,f1,vol){
  const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = NB;
  const fl = AC.createBiquadFilter(); fl.type = type;
  fl.frequency.setValueAtTime(f0,t); fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t, R()); s.stop(t+dur);
}
function tone(dur,f0,f1,vol,type){
  const t = AC.currentTime, o = AC.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur);
}
let lastSnd = {};
function snd(n, v){
  if (!AC) return; v = v ?? 1;
  const now = performance.now(); if (now - (lastSnd[n]||0) < 35) return; lastSnd[n] = now;
  if (n==='hit'){ noise(.14,'bandpass',2600,500,.55*v); tone(.16,190+R()*60,45,.6*v); }
  else if (n==='block'){ tone(.07,1400,500,.25*v,'square'); noise(.08,'highpass',2500,5000,.3*v); }
  else if (n==='boom'){ noise(1.5,'lowpass',1200,50,.95*v); tone(1.1,95,22,.9*v); }
  else if (n==='whoosh'){ noise(.32,'bandpass',300+R()*200,2600,.35*v); }
  else if (n==='zap'){ tone(.12,700+R()*900,180,.12*v,'sawtooth'); noise(.1,'highpass',3000,7000,.18*v); }
  else if (n==='rumble'){ noise(2.2,'lowpass',180,60,.5*v); }
  else if (n==='thud'){ tone(.25,110,40,.6*v); noise(.3,'lowpass',600,80,.5*v); }
}

// ===================== parçacıklar & efektler =====================
function P_(o){ if (parts.length < 1800) parts.push(Object.assign({life:0,max:1,vx:0,vy:0,r:1,g:0,drag:0,col:'200,200,200',t:'dust',a:1,grow:1.5},o)); }
function upParts(dt){
  for (const p of parts){
    p.life += dt; p.vy += p.g*dt;
    const k = Math.exp(-p.drag*dt); p.vx *= k; p.vy *= k;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.floor && p.y > 0){ p.y = 0; p.vy = 0; }
  }
  parts = parts.filter(p => p.life < p.max);
}
function drawParts(){
  for (const p of parts){
    const k = p.life/p.max, a = p.a*(1-k);
    if (p.t==='dust'){
      X.fillStyle = `rgba(${p.col},${a})`; X.beginPath(); X.arc(p.x,p.y,p.r*(1+k*p.grow),0,7); X.fill();
    } else if (p.t==='spark'){
      X.strokeStyle = `rgba(${p.col},${a})`; X.lineWidth = p.r; X.lineCap = 'round';
      X.beginPath(); X.moveTo(p.x,p.y); X.lineTo(p.x-p.vx*.05,p.y-p.vy*.05); X.stroke();
    } else if (p.t==='ring'){
      const r = p.r + p.life*p.sp;
      X.strokeStyle = `rgba(${p.col},${a})`; X.lineWidth = Math.max(.01,p.w*(1-k));
      X.beginPath(); X.ellipse(p.x,p.y,r,r*(p.fl||1),0,0,7); X.stroke();
    } else if (p.t==='bolt'){
      X.globalAlpha = a; bolt(p.x,p.y,p.x+p.ex,p.y+p.ey,p.r,'#fff','#bfe8ff'); X.globalAlpha = 1;
    }
  }
}
function impact(x,y,sz,col){
  col = col || '255,255,255';
  P_({t:'ring',x,y,r:sz*.4,sp:sz*12,w:sz*.4,max:.22,col});
  const n = 8 + sz*2;
  for (let i=0;i<n;i++){
    const a = R()*PI*2, v = sz*(18+R()*30);
    P_({t:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,max:.15+R()*.2,r:sz*.12,drag:4,col});
  }
  flashA = Math.max(flashA, .06 + sz*.015); shake = Math.max(shake, sz*.45);
}
function dustBurst(x,y,n,sz,col){
  for (let i=0;i<n;i++){
    const dir = R()<.5?-1:1;
    P_({x:x+(R()-.5)*sz,y:y-R()*sz*.3,vx:dir*(4+R()*sz*12),vy:-R()*sz*3,r:sz*(.4+R()*.8),grow:2.5,
        max:.8+R()*1.1,drag:1.6,col:col||'150,150,150',a:.75,floor:true});
  }
}
function bolt(x1,y1,x2,y2,w,col,glow,jag){
  const n = 9, dx = x2-x1, dy = y2-y1, L = Math.hypot(dx,dy)||1, nx = -dy/L, ny = dx/L;
  X.beginPath(); X.moveTo(x1,y1);
  for (let i=1;i<n;i++){ const t=i/n, o=(R()-.5)*L*(jag||.2); X.lineTo(x1+dx*t+nx*o, y1+dy*t+ny*o); }
  X.lineTo(x2,y2);
  X.lineCap = X.lineJoin = 'round';
  const ga = X.globalAlpha;
  X.shadowColor = glow; X.shadowBlur = 18; X.strokeStyle = glow; X.lineWidth = w*2.2; X.globalAlpha = ga*.5; X.stroke();
  X.globalAlpha = ga; X.strokeStyle = col; X.lineWidth = w; X.stroke(); X.shadowBlur = 0;
}

// ===================== çöp adam =====================
// [gövde eğimi, ön kol üst, ön kol alt, arka kol üst, arka kol alt, ön bacak üst, ön bacak alt, arka bacak üst, arka bacak alt]
// Açılar dünya açısı: 0 = aşağı, PI/2 = ileri (yüze doğru), PI = yukarı, -PI/2 = geri.
const PO = {
  stand   : [0,   .15,.08, -.15,-.08,  .1,.05,  -.1,-.05],
  stance  : [.12, .75,2.35, .35,2.05,  .5,.02,  -.45,-.12],
  stance2 : [.22, .85,2.45, .45,2.15,  .75,-.08,-.55,-.4],
  jabW    : [.05, .55,2.55, .35,2.1,   .48,.02, -.45,-.12],
  jab     : [.3,  1.6,1.57, .3,2.25,   .62,.1,  -.62,-.2],
  crossW  : [0,   .7,2.5,   .1,2.3,    .45,.02, -.45,-.12],
  cross   : [.45, .45,2.4,  1.62,1.57, .78,.15, -.78,-.35],
  hookW   : [-.05,1.1,1.9,  .3,2.1,    .5,.02,  -.5,-.15],
  hook    : [.3,  1.5,2.95, .25,2.1,   .62,.05, -.6,-.2],
  upperW  : [.4,  .45,1.2,  .25,1.9,   .95,-.25,-.4,-.55],
  upper   : [-.2, 2.0,3.0,  .2,2.0,    .4,.05,  -.35,-.1],
  kickW   : [-.1, .7,2.3,  -.2,1.5,    1.65,.25,-.15,-.05],
  kick    : [-.45,.4,1.9,  -1.0,-.4,   1.65,1.6,-.12,-.05],
  roundW  : [.05, .9,2.4,  -.3,1.0,    1.95,.65,-.2,-.1],
  highKick: [-.7, .1,1.2,  -1.2,-.8,   2.3,2.35,-.15,-.05],
  knee    : [.25, 1.3,2.0,  .9,1.9,    2.05,.35,-.25,-.1],
  elbow   : [.45, 1.75,-2.6,.3,2.1,    .7,.1,   -.7,-.3],
  lowW    : [.2,  .85,2.45, .45,2.15,  .8,-.1,  -.5,-.3],
  lowKick : [.3,  .9,2.4,   .4,2.0,    1.25,1.3,-.3,-.4],
  turn    : [.25, .3,1.0,  -.3,.5,     .15,-.05,-.2,-.2],
  backKick: [.6,  .6,1.1,  -.3,.3,    -1.62,-1.58,.1,.05],
  jump    : [.1,  1.2,2.4,  .6,2.0,    1.9,.2,   1.3,-.4],
  airKick : [-.6, .6,1.8,  -1.2,-.6,   1.72,1.68,.9,-.6],
  land    : [.7,  .4,.2,   -1.3,-1.8,  1.4,0,    .4,-1.4],
  block   : [-.05,1.25,2.9, 1.05,2.8,  .45,0,   -.55,-.2],
  blockLow: [.35, .6,1.5,   .4,1.3,    .65,0,   -.5,-.25],
  duck    : [.55, .8,2.6,   .45,2.3,   1.5,-.1,  .2,-1.2],
  lean    : [-.5, .6,2.2,  -.2,1.6,    .6,.05,  -.3,-.05],
  headHit : [-.5, .3,1.1,  -.7,-.4,    .45,0,   -.6,-.25],
  gutHit  : [.8,  .25,.6,  -.1,.25,    .35,0,   -.5,-.2],
  lowHit  : [.3,  1.0,2.0, -.5,.5,     .2,-.4,  -.5,-.2],
  hurtAir : [-.8, 2.6,2.2, -2.4,-2.9,  .9,.3,    .3,.9],
  lie     : [-1.5,-1.9,-2.2,-1.5,-1.2, 1.45,1.5, 1.35,1.6],
  kneel   : [.3,  .5,.25,  -.3,.1,     1.5,-.05, .45,-1.5],
  grab    : [.3,  1.4,1.5,  1.3,1.4,   .6,.1,   -.6,-.2],
  throwP  : [-.4, 2.6,2.9,  2.4,2.8,   .4,0,    -.7,-.3],
  crouch  : [.6,  .4,.2,   -.1,.2,     1.4,-.2,  .3,-.9],
  run1    : [.4,  1.0,2.1, -.9,-.3,    .9,.1,   -.7,-1.9],
  run2    : [.4, -.9,-.3,   1.0,2.1,  -.7,-1.9,  .9,.1],
  walk1   : [.05, .4,.25,  -.4,-.3,    .35,.1,  -.35,-.55],
  walk2   : [.05,-.4,-.3,   .4,.25,   -.35,-.55, .35,.1],
  fly     : [1.45,1.65,1.6,-1.4,-1.5, -1.45,-1.5,-1.6,-1.65],
  raise   : [0,   3.0,3.1, -.25,-.1,   .15,.05, -.15,-.05],
  burst   : [0,   2.0,2.4, -2.0,-2.4,  .5,.15,  -.5,-.15],
  fall    : [0,   2.6,2.9, -2.6,-2.9,  .2,.1,   -.2,-.1],
  slam    : [.5,  .9,.3,   -.6,-.2,    .7,.1,   -.6,-.2],
  guard   : [-.1, 2.5,3.0,  2.1,3.0,   .5,.05,  -.5,-.1],
};
PO.hurt = PO.hurtAir; PO.punch = PO.jab;
const mix = (a,b,t) => a.map((v,i) => lerp(v,b[i],t));
const walkPose = (t,sp,A,B) => mix(A||PO.walk1, B||PO.walk2, .5+.5*Math.sin(t*sp));

// eklem noktalarını hesapla (çizmeden)
function figPts(o){
  const p = o.pose, s = o.s||10, f = o.f||1, sp = (o.spin||0)*f;
  const d = (a,l) => [Math.sin(a+sp)*l*f, Math.cos(a+sp)*l];
  const T=s, UA=s*.48, FA=s*.48, TH=s*.58, SH=s*.6, HR=s*.34;
  const tor = d(PI-p[0],T), hd = d(PI-p[0],T+HR*.92);
  const e1=d(p[1],UA), h1=d(p[2],FA), e2=d(p[3],UA), h2=d(p[4],FA);
  const k1=d(p[5],TH), f1=d(p[6],SH), k2=d(p[7],TH), f2=d(p[8],SH);
  let hx = o.x, hy = o.y;
  if (o.g != null) hy = o.g - Math.max(k1[1]+f1[1], k2[1]+f2[1]) - s*.085 - (o.h||0);
  const N = [hx+tor[0], hy+tor[1]];
  const P = { hip:[hx,hy], neck:N, head:[hx+hd[0],hy+hd[1]],
    fe:[N[0]+e1[0],N[1]+e1[1]], be:[N[0]+e2[0],N[1]+e2[1]], fk:[hx+k1[0],hy+k1[1]], bk:[hx+k2[0],hy+k2[1]] };
  P.fh = [P.fe[0]+h1[0],P.fe[1]+h1[1]]; P.bh = [P.be[0]+h2[0],P.be[1]+h2[1]];
  P.ff = [P.fk[0]+f1[0],P.fk[1]+f1[1]]; P.bf = [P.bk[0]+f2[0],P.bk[1]+f2[1]];
  P.hand = P.fh; P.foot = P.ff; P.s = s; P.f = f; P.HR = HR;
  return P;
}
function fig(o){
  const P = figPts(o), s = P.s, f = P.f, HR = P.HR, [cx,cy] = P.head;
  X.save(); X.globalAlpha = o.alpha ?? 1;
  X.lineCap = X.lineJoin = 'round';
  const L = (...pts) => { X.moveTo(pts[0][0],pts[0][1]); for (let i=1;i<pts.length;i++) X.lineTo(pts[i][0],pts[i][1]); };
  const body = () => { X.beginPath(); L(P.neck,P.be,P.bh); L(P.hip,P.bk,P.bf); L(P.hip,P.neck); L(P.hip,P.fk,P.ff); L(P.neck,P.fe,P.fh); };
  if (o.rim){ X.strokeStyle = X.fillStyle = o.rim; X.lineWidth = s*.27; body(); X.stroke(); X.beginPath(); X.arc(cx,cy,HR+s*.05,0,7); X.fill(); }
  X.strokeStyle = X.fillStyle = o.c; X.lineWidth = s*.17;
  body(); X.stroke();
  X.beginPath(); X.arc(cx,cy,HR,0,7); X.fill();
  if (o.c !== WHT && o.eyes !== false){
    const ox = o.front ? 0 : f*HR*.3, gap = HR*.3, ry = Math.max(HR*.04, HR*.3*(1-(o.blink||0))), rx = HR*.14;
    X.fillStyle = '#fff';
    X.beginPath(); X.ellipse(cx+ox-gap,cy-HR*.05,rx,ry,0,0,7); X.ellipse(cx+ox+gap,cy-HR*.05,rx,ry,0,0,7); X.fill();
  }
  X.restore();
  return P;
}
function ghosts(fn, t, n, gap){ for (let i=n;i>=1;i--){ const o = fn(t-i*(gap||.025)); if (o){ o.alpha = .12*(n-i+1)/n; fig(o); } } }

// ===================== dövüş motoru =====================
// Her dövüşçü bir anahtar kare izine sahip. Kareler arası Hermite (Catmull-Rom) eğrisiyle
// yumuşak geçilir; kol ve bacak uçları gövdeden biraz geride gelir (kamçı etkisi).
const TEN = .9;
class Fx {
  constructor(c, x, f, o){
    o = o || {}; this.c = c; this.s = o.s || 10; this.ground = o.ground !== false; this.baseY = o.baseY || 0;
    this.ph = (x*7.13) % 6; this.k = []; this.busy = -1; this.camFrom = null; this.camUntil = null;
    this.key(0, o.pose || PO.stance, x, 0, 0, f);
  }
  key(t, p, x, h, sp, f){
    if (typeof p === 'string') p = PO[p];
    const L = this.k[this.k.length-1];
    this.k.push({ t, v:[...p, x, h||0, sp ?? (L ? L.v[11] : 0)], f: f ?? (L ? L.f : 1) });
    return this;
  }
  ev(t){
    const k = this.k, n = k.length;
    if (n === 1 || t <= k[0].t) return k[0];
    if (t >= k[n-1].t) return k[n-1];
    let lo = 0, hi = n-1; while (hi-lo > 1){ const m = (lo+hi) >> 1; if (k[m].t <= t) lo = m; else hi = m; }
    const a = k[lo], b = k[lo+1], h = b.t-a.t, s = (t-a.t)/h, s2 = s*s, s3 = s2*s;
    const h00 = 2*s3-3*s2+1, h10 = s3-2*s2+s, h01 = -2*s3+3*s2, h11 = s3-s2;
    const p = k[lo-1], q = k[lo+2], v = new Array(12);
    for (let i=0;i<12;i++){
      const ma = p ? (b.v[i]-p.v[i])/(b.t-p.t)*TEN : 0, mb = q ? (q.v[i]-a.v[i])/(q.t-a.t)*TEN : 0;
      v[i] = h00*a.v[i] + h10*h*ma + h01*b.v[i] + h11*h*mb;
    }
    return { v, f:a.f };
  }
  cut(t){ const s = this.ev(t); this.k = this.k.filter(k => k.t < t-1e-4); this.k.push({ t, v:s.v.slice(), f:s.f }); }
  end(){ return this.k[this.k.length-1]; }
}
// bir dövüşçünün t anındaki çizim nesnesi (gecikmeli uzuvlar + nefes/zıplama)
function fo(F, t){
  const a = F.ev(t), u = F.ev(t-.012), l = F.ev(t-.03), q = F.ev(t-.07);
  const p = a.v.slice(0,9);
  if (u.f === a.f){ p[1]=u.v[1]; p[3]=u.v[3]; p[5]=u.v[5]; p[7]=u.v[7]; }
  if (l.f === a.f){ p[2]=l.v[2]; p[4]=l.v[4]; p[6]=l.v[6]; p[8]=l.v[8]; }
  let mv = 0; for (let i=0;i<9;i++) mv += Math.abs(a.v[i]-q.v[i]); mv += Math.abs(a.v[9]-q.v[9])*.15;
  const idle = clamp(1-mv*1.2,0,1), ph = t*7.5+F.ph;
  p[0] += idle*Math.sin(ph)*.03; p[2] += idle*Math.sin(ph+.6)*.1; p[4] += idle*Math.sin(ph+1.2)*.1;
  if (F.ground){
    const h = Math.max(0,a.v[10]) + idle*(.25+.25*Math.sin(ph*2));
    return { x:a.v[9], g:0, h, f:a.f, s:F.s, c:F.c, pose:p, spin:a.v[11], rim:F.rim };
  }
  return { x:a.v[9], y:F.baseY - a.v[10] - idle*Math.sin(ph*.4)*.8, f:a.f, s:F.s, c:F.c, pose:p, spin:a.v[11], rim:F.rim };
}
const LIMBS = ['fh','bh','ff','bf'];
function drawF(F, t){
  const s = F.s;
  // hızlı vücut hareketinde art görüntü
  const vx = Math.abs(F.ev(t).v[9] - F.ev(t-.05).v[9]) + Math.abs(F.ev(t).v[10] - F.ev(t-.05).v[10]);
  if (vx > s*.55){ for (let i=3;i>=1;i--){ const o = fo(F,t-i*.03); o.alpha = .1*(4-i); fig(o); } }
  // uzuv izleri (smear)
  const S = []; for (let i=0;i<7;i++) S.push(figPts(fo(F,t-i*.011)));
  X.lineCap = 'round';
  for (const L of LIMBS){
    let len = 0; for (let i=1;i<7;i++) len += Math.hypot(S[i][L][0]-S[i-1][L][0], S[i][L][1]-S[i-1][L][1]);
    if (len < s*1.6) continue;
    const k = clamp((len-s*1.6)/(s*2),0,1);
    X.strokeStyle = F.c;
    for (let i=0;i<6;i++){
      X.globalAlpha = .45*(1-i/6)*k; X.lineWidth = s*.17*(1-i/7);

function ex(t, A, B, mv, rc){
  const M = MV[mv], RC = REACT[rc];
  A.cut(t);
  const a = A.ev(t); let ax = a.v[9];
  let tw = 0; for (let i=0;i<=M.hit;i++) tw += M.k[i][0];
  const bx = B.ev(t+tw).v[9], fA = bx >= ax ? 1 : -1;

    const dist = ext-1.5, dur = Math.max(.14, dist/75), n = Math.max(2, Math.round(dur/.07));
    for (let i=1;i<=n;i++) A.key(t+dur*i/n, i%2 ? 'run1' : 'run2', ax+fA*dist*i/n, 0, null, fA);
    tt = t+dur; x = ax+fA*dist; ext = 1.5;
  }
  if (ext < -2.5){                                     // çok yakın: önce geri sıçra
    const back = -ext, dur = .1+back*.012;
    A.key(t+dur*.5,'stance2',ax-fA*back*.6,1,null,fA); A.key(t+dur,'stance2',ax-fA*back,0,null,fA);
    tt = t+dur; x = ax-fA*back; ext = 0;
  }
  ext = clamp(ext,-2.5,5);
  const sp0 = A.end().v[11];
  let f = fA, tc = 0;
  M.k.forEach((k,i) => {
    tt += k[0]; x += fA*(k[2] + (i===0 ? ext : 0)); if (k[4]) f = -f;
    A.key(tt, k[1], x, k[3]||0, sp0, f);

    else { const i = Math.floor(r()*F.length); A = F[i]; B = F[(i+1+Math.floor(r()*(F.length-1)))%F.length]; }
    const wait = Math.max(A.busy, B.busy); if (wait > t){ t = wait-.15; if (t >= t1) break; }
    if (streak === 0 && r() < (o.pause ?? .1)){ shuffle(A,B,t,r); t += .5+r()*.3; continue; }
    let mv, g = 0; do { mv = wpick(mw,r); g++; } while (last.includes(mv) && g < 30);

  if (t < 3.5){ cam.x = 0; cam.y = -16; cam.z = lerp(1.1,1.5,eio(t/3.5)); }
  else if (t < 6.8){ cam.x = 0; cam.y = -24; cam.z = lerp(3.2,3.6,seg(3.5,6.8)); }
  else { cam.x = 0; cam.y = -25.5; cam.z = lerp(3.6,7.5,eio(seg(6.8,9))); }
  begin('light');
  if (R() < .3) P_({x:cam.x+(R()-.5)*60,y:-R()*20,vx:8+R()*6,vy:-R(),r:.4+R()*.6,grow:1,max:2,col:'240,240,240',a:.6});
  const br = (ph) => PO.stance.map((v,i) => v + (i===2||i===4 ? Math.sin(t*5+ph+i)*.07 : 0));
  if (t < 3.5){
    fig({ x:-20, g:0, h:.2+.2*Math.sin(t*6), f:1, s:10, c:RED, pose:br(0) });
    fig({ x:20, g:0, h:.2+.2*Math.sin(t*6+2), f:-1, s:10, c:BLK, pose:br(2) });
    fig({ x:0, g:0, f:1, s:10.5, c:WHT, pose:PO.stand, front:true });
  } else if (t < 6.8){
    fig({ x:0, g:0, f:1, s:11, c:WHT, pose:PO.stand, front:true });
    fig({ x:-7.5, g:0, f:1, s:10, c:RED, pose:PO.stand, front:true, blink:eio(seg(5.5,6))*.5 });
    fig({ x:7.5, g:0, f:1, s:10, c:BLK, pose:PO.stand, front:true, blink:eio(seg(5.5,6))*.5 });
  } else {
    fig({ x:0, g:0, f:1, s:10, c:BLK, pose:PO.stand, front:true, blink:eio(seg(7.8,8.4))*.8 });
  }
  fadeA = seg(8.7,10);
  if (at(8.4)) snd('hit',.4);
}});

// ===================== döngü =====================
const TOTAL = SC.reduce((a,s) => a+s.d, 0);
function enter(i){ si = i; st = 0; prevSt = -1; flashC = '255,255,255'; hitstop = 0; zoomKick = 0; if (SC[si] && SC[si].init) SC[si].init(); }
function step(dt){
  if (!started) return;
  let sdt = dt; if (hitstop > 0){ hitstop -= dt; sdt = dt*.07; }
  prevSt = st; st += sdt;
  if (st >= SC[si].d){
    if (si+1 >= SC.length){ finish(); return; }
    enter(si+1);
  }
  upParts(sdt);
  shake *= Math.exp(-dt*5); flashA *= Math.exp(-dt*4); zoomKick *= Math.exp(-dt*5);
}
function render(dt){
  X.setTransform(DPR,0,0,DPR,0,0); X.globalAlpha = 1;
  if (!started){ X.fillStyle = '#000'; X.fillRect(0,0,W,H); return; }
  fadeA = 0;
  SC[si].f(st,dt);
  drawParts();
  X.setTransform(DPR,0,0,DPR,0,0);
  if (flashA > .01){ X.fillStyle = `rgba(${flashC},${Math.min(1,flashA)})`; X.fillRect(0,0,W,H); }
  if (fadeA > 0){ X.fillStyle = `rgba(0,0,0,${fadeA})`; X.fillRect(0,0,W,H); }
  let el = st; for (let i=0;i<si;i++) el += SC[i].d;
  bar.style.width = (el/TOTAL*100) + '%';
}
function finish(){
  started = false; parts = []; shake = flashA = 0; enter(0);
  ov.innerHTML = '<b>SO<i>N</i></b><span>↻ Tekrar izlemek için tıkla</span>'; ov.style.display = 'flex'; bar.style.width = '0';
}
let last = 0;
function loop(ts){
  const dt = Math.min(.05, (ts-last)/1000 || 0); last = ts;
  step(dt); render(dt);
  requestAnimationFrame(loop);
}
ov.addEventListener('click', () => {
  if (!AC) initAudio(); else if (AC.state === 'suspended') AC.resume();
  ov.style.display = 'none'; parts = []; enter(0); started = true;
});
requestAnimationFrame(loop);
// test kancası: belirli bir saniyeye hızlı ilerlet
window.__seek = sec => { started = true; ov.style.display = 'none'; parts = []; enter(0);
  const n = Math.round(sec*30); for (let i=0;i<n;i++){ step(1/30); if (!started) return; render(1/30); } };
window.__total = TOTAL;
</script>
</body>
